<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="t d">
  <title id="t">상품 준비와 사용자 요청 데이터 파이프라인</title>
  <desc id="d">상품 자료 준비, 사용자 입력과 생성·추천, 사용자 행동 집계의 실행 경계를 나란한 세 영역으로 표현한다.</desc>
  <defs>
    <style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#19334c}.title{font-size:40px;font-weight:700}.sub{font-size:19px;fill:#617184}.section{font-size:22px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px;fill:#405a70}.note{font-size:16px;fill:#617184}.a{stroke:#657b90;stroke-width:3;fill:none;marker-end:url(#arrow)}.feed{stroke:#13998e;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#teal)}</style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#657b90" stroke-width="2"/></marker>
    <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#13998e" stroke-width="2"/></marker>
  </defs>
  <rect width="1500" height="930" fill="#f5f8fc"/><rect width="1500" height="10" fill="#13998e"/>
  <text class="title" x="58" y="72">두 경로가 만나는 지점</text>
  <text class="sub" x="59" y="108">상품은 미리 준비하고, 사용자의 생성·추천 요청은 준비된 자료를 조회합니다.</text>

  <rect x="40" y="143" width="1420" height="239" rx="21" fill="#fff" stroke="#d8e2ec" stroke-width="2"/>
  <text class="section" x="63" y="183" fill="#a06a19">A  상품 자료 준비</text>
  <text class="note" x="303" y="183">최초 적재·주기 갱신 시 실행</text>
  <g fill="#fff8ed" stroke="#ead2a7" stroke-width="1.5"><rect x="62" y="205" width="310" height="116" rx="15"/><rect x="417" y="205" width="310" height="116" rx="15"/><rect x="772" y="205" width="310" height="116" rx="15"/><rect x="1127" y="205" width="310" height="116" rx="15"/></g>
  <text class="head" x="85" y="241">다나와 상품·이미지 수집</text><text class="body" x="85" y="273">상품정보·이미지 바이트</text><text class="note" x="85" y="299">상품 ID·개별 URL 연결</text>
  <text class="head" x="440" y="241">원천 보존</text><text class="body" x="440" y="273">MongoDB · 이미지 저장소</text><text class="note" x="440" y="299">저장 확인 후 원천 ID 전달</text>
  <text class="head" x="795" y="241">Spark · Delta</text><text class="body" x="795" y="273">Bronze → Silver → Gold</text><text class="note" x="795" y="299">정제·품질 검증</text>
  <text class="head" x="1150" y="241">서비스 자료</text><text class="body" x="1150" y="273">MySQL · 이미지 임베딩 · FAISS</text><text class="note" x="1150" y="299">검증한 버전만 활성화</text>
  <path class="a" d="M379 263H403"/><path class="a" d="M734 263H758"/><path class="a" d="M1089 263H1113"/>
  <text class="note" x="63" y="352">Kafka는 원천 ID와 처리 이벤트를 전달합니다. 이미지 파일 본문은 메시지에 넣지 않습니다.</text>

  <rect x="40" y="420" width="1420" height="239" rx="21" fill="#fff" stroke="#d8e2ec" stroke-width="2"/>
  <text class="section" x="63" y="460" fill="#2864ac">B  사용자 생성과 추천</text>
  <text class="note" x="340" y="460">사용자 요청 시 실행 · 상품 전체 수집은 재실행하지 않음</text>
  <g fill="#eff5ff" stroke="#bad0ea" stroke-width="1.5"><rect x="62" y="482" width="310" height="116" rx="15"/><rect x="417" y="482" width="310" height="116" rx="15"/><rect x="772" y="482" width="310" height="116" rx="15"/><rect x="1127" y="482" width="310" height="116" rx="15"/></g>
  <text class="head" x="85" y="518">입력 접수</text><text class="body" x="85" y="550">공간 사진 + 스케치/텍스트</text><text class="note" x="85" y="576">Application이 버전 보존</text>
  <text class="head" x="440" y="518">보존 확인 · 생성</text><text class="body" x="440" y="550">입력 Bronze → 템플릿 선택</text><text class="note" x="440" y="576">Consumer → Cloudflare 생성</text>
  <text class="head" x="795" y="518">결과 물체 선택</text><text class="body" x="795" y="550">품목·영역 확인 및 수정</text><text class="note" x="795" y="576">생성 결과 유지</text>
  <text class="head" x="1150" y="518">광고 서버 추천</text><text class="body" x="1150" y="550">준비된 상품 검색·링크 확인</text><text class="note" x="1150" y="576">다나와 연결</text>
  <path class="a" d="M379 540H403"/><path class="a" d="M734 540H758"/><path class="a" d="M1089 540H1113"/>
  <path class="feed" d="M1280 388V469"/><text class="note" x="1294" y="411">준비된 상품 조회</text>
  <text class="note" x="63" y="630">추천 실패는 생성 결과를 삭제하거나 생성 API를 다시 호출하는 원인이 아닙니다.</text>

  <rect x="40" y="699" width="1420" height="160" rx="21" fill="#fff" stroke="#d8e2ec" stroke-width="2"/>
  <text class="section" x="63" y="738" fill="#7253b1">C  사용자 행동 집계</text>
  <text class="body" x="63" y="777">실제 노출·선택·클릭</text><path class="a" d="M295 772H354"/>
  <text class="body" x="371" y="777">Application 이벤트 저장·발행</text><path class="a" d="M655 772H708"/>
  <text class="body" x="725" y="777">Kafka → Spark Bronze/Silver/Gold</text><path class="a" d="M1100 772H1146"/>
  <text class="body" x="1164" y="777">MySQL 반응 집계</text>
  <text class="note" x="63" y="825">반응은 노출과 연결해 집계합니다. 추천 목록 반환만으로 노출이나 구매를 기록하지 않습니다.</text>
  <text class="note" x="58" y="903">화살표는 의존 관계입니다. MongoDB·Delta·MySQL·Kafka가 하나의 트랜잭션으로 처리된다는 뜻은 아닙니다.</text>
</svg>
