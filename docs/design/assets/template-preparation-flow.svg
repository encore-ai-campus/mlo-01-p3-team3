<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
<title id="title">템플릿 제작과 등록</title><desc id="desc">공간 구성에 사용할 템플릿을 미리 준비하는 경로입니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="350" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">템플릿 제작과 등록</text><text class="sub" x="53" y="102">공간 구성에 사용할 템플릿을 미리 준비하는 경로입니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">사전 준비 · 사용자 요청마다 재제작하지 않음</text><rect x="55" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="73" y="215">1  특징 정의·제작</text><text class="card-body" x="73" y="241">품목 · 형태 · 스타일</text><path d="M329 222H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="426" y="215">2  검수·파일 등록</text><text class="card-body" x="426" y="241">출처 · 이용 범위 · 버전</text><path d="M682 222H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="779" y="215">3  벡터 준비</text><text class="card-body" x="779" y="241">Consumer → Delta Silver</text><path d="M1035 222H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1132" y="215">4  인덱스 등록</text><text class="card-body" x="1132" y="241">검증 버전만 활성화</text><text class="note" x="53" y="332">실제 판매 상품 이미지를 그대로 공간 생성 재료로 쓰지 않습니다. 검수·활성 버전만 선택합니다.</text></svg>
