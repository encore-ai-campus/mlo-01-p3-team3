<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc">
<title id="title">로컬 인프라의 역할 구성</title>
<desc id="desc">사용자 서비스, 상품 준비와 처리, 데이터 저장, 접근 관리, 모니터링 역할을 묶은 구성도입니다. VM 대수와 IP는 문서의 배치표에서 관리합니다.</desc>
<defs>
<style>
text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}
.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}
.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}
.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}
</style>
</defs>
<rect width="1440" height="770" fill="#f6f9fc"/>
<rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">로컬 인프라의 역할 구성</text>
<text class="sub" x="53" y="103">모니터링 VM을 포함한 역할 구성입니다. VM 대수와 IP는 문서의 배치표에서 관리합니다.</text>

<rect x="38" y="128" width="1364" height="132" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="144" width="7" height="28" rx="3" fill="#176b63"/>
