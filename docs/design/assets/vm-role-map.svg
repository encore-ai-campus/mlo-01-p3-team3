<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
<title id="title">20대 VM 역할 구성</title><desc id="desc">Webapp의 Django와 별도 Ad 서버를 구분하고, 역할별 VM 수를 표시합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic",Arial,sans-serif;fill:#19334c} .muted{fill:#5e7080}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#71869b" stroke-width="1.5"/></marker></defs>
