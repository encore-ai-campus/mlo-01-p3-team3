<rect x="80" y="184" width="570" height="61" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="100" y="210">Application</text>
<text class="card-body" x="100" y="233">Django 웹 · AI Consumer · 직접 발행</text>
