<text x="78.0" y="645" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">pj3-nifi</text>
<text x="78.0" y="668" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">수집 주기 · 전달 관리</text>
