<rect x="790" y="628" width="570" height="61" rx="13" fill="#f1eff8" stroke="#aaa1cb" stroke-width="1.5"/>
<text class="card-title" x="810" y="654">pj3-monitor</text>
<text class="card-body" x="810" y="677">Prometheus · Grafana 대시보드 · node_exporter 수집기</text>

<text class="note" x="53" y="746">그림은 기능적 역할을 표시합니다. 실제 대수 · 실행 위치 · 물리 배치는 배치표와 검증 결과를 따릅니다.</text>
