<text x="838.0" y="421" font-size="20" font-weight="700" text-anchor="start" data-max-width="684.0">Prometheus · Grafana · 1대</text>
<text x="838.0" y="447" font-size="17" font-weight="400" text-anchor="start" data-max-width="684.0" style="fill:#52697d">pj3-monitor</text>
<text x="838.0" y="470" font-size="17" font-weight="400" text-anchor="start" data-max-width="684.0" style="fill:#52697d">지표 수집 · 대시보드</text>
<rect x="34" y="528" width="1532" height="182" rx="18" fill="#fff" stroke="#dce5ed" stroke-width="1.4"/>
<rect x="51" y="545" width="6" height="27" rx="3" fill="#95611f" stroke="#95611f" stroke-width="1.4"/>
<text x="72" y="568" font-size="21" font-weight="700" text-anchor="start" data-max-width="1470" style="fill:#95611f">C  수집 · 메시지 · 분산 연산  /  8대</text>
<rect x="60.0" y="590" width="340.0" height="90" rx="12" fill="#fff5e8" stroke="#e6c593" stroke-width="1.4"/>
