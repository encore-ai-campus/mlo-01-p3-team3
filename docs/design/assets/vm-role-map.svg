<text x="458.0" y="619" font-size="20" font-weight="700" text-anchor="start" data-max-width="304.0">Kafka · 3대</text>
<text x="458.0" y="645" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">pj3-kafka01~03</text>
<text x="458.0" y="668" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">이벤트 전달</text>
<rect x="820.0" y="590" width="340.0" height="90" rx="12" fill="#fff5e8" stroke="#e6c593" stroke-width="1.4"/>
<text x="838.0" y="619" font-size="20" font-weight="700" text-anchor="start" data-max-width="304.0">Spark Master · 1대</text>
<text x="838.0" y="645" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">pj3-spark-master</text>
<text x="838.0" y="668" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">Master · 작업 제출</text>
<rect x="1200.0" y="590" width="340.0" height="90" rx="12" fill="#fff5e8" stroke="#e6c593" stroke-width="1.4"/>
<text x="1218.0" y="619" font-size="20" font-weight="700" text-anchor="start" data-max-width="304.0">Spark Worker · 3대</text>
<text x="1218.0" y="645" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">pj3-spark-worker01~03</text>
<text x="1218.0" y="668" font-size="17" font-weight="400" text-anchor="start" data-max-width="304.0" style="fill:#52697d">분산 연산</text>
<rect x="34" y="726" width="1532" height="182" rx="18" fill="#fff" stroke="#dce5ed" stroke-width="1.4"/>
<rect x="51" y="743" width="6" height="27" rx="3" fill="#684891" stroke="#684891" stroke-width="1.4"/>
<text x="72" y="766" font-size="21" font-weight="700" text-anchor="start" data-max-width="1470" style="fill:#684891">D  데이터 저장  /  8대</text>
<rect x="60.0" y="788" width="466.6666666666667" height="90" rx="12" fill="#f3effb" stroke="#c0aee0" stroke-width="1.4"/>
<text x="78.0" y="817" font-size="20" font-weight="700" text-anchor="start" data-max-width="430.6666666666667">MySQL · 3대</text>
<text x="78.0" y="843" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">pj3-mysql01~03</text>
<text x="78.0" y="866" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">서비스 데이터 · 업무 원장</text>
<rect x="566.6666666666667" y="788" width="466.6666666666667" height="90" rx="12" fill="#f3effb" stroke="#c0aee0" stroke-width="1.4"/>
<text x="584.6666666666667" y="817" font-size="20" font-weight="700" text-anchor="start" data-max-width="430.6666666666667">MongoDB · 3대</text>
<text x="584.6666666666667" y="843" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">pj3-mongo01~03</text>
<text x="584.6666666666667" y="866" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">상품 원천 보존</text>
<rect x="1073.3333333333335" y="788" width="466.6666666666667" height="90" rx="12" fill="#f3effb" stroke="#c0aee0" stroke-width="1.4"/>
<text x="1091.3333333333335" y="817" font-size="20" font-weight="700" text-anchor="start" data-max-width="430.6666666666667">Object Storage · 2대</text>
<text x="1091.3333333333335" y="843" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">pj3-object01 / pj3-object02</text>
<text x="1091.3333333333335" y="866" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">이미지·Delta 역할의 개별 배정 미확정</text>
<text x="56" y="959" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">합계 20대 = 서비스 2 + 관리·모니터링 2 + 수집·메시지·연산 8 + 저장 8</text>
<text x="56" y="991" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">그룹 안의 VM은 역할별 배치 목록입니다. 이 그림의 가로 화살표는 서비스 호출 순서를 의미하지 않습니다.</text>
<text x="56" y="1023" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">실제 IP·계정·접속정보는 포함하지 않습니다. 자원 할당·클러스터 상태는 구축 후 별도 검증합니다.</text>
<text x="56" y="1055" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">Object Storage 두 VM 중 이미지용·Delta용의 개별 서버 대응은 확인 후 확정합니다.</text>
<text x="56" y="1103" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">현재 인프라 문서의 20대 기준 · 논리 서버명은 전달받은 구성 문서 표기를 따릅니다.</text>
</svg>
