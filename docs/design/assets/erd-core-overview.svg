<text x="56" y="987" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">화살표는 관계를 읽는 방향입니다. 서버 호출 순서가 아니며 전체 FK·필드는 상세 사전을 따릅니다.</text>
<text x="56" y="1018" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">신규 v2 논리 설계 · ORM/DDL 반영 완료를 뜻하지 않습니다. 생성 실행·생성 물체 연결은 신규 필수가 아닙니다.</text>
