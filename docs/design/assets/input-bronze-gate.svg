<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">입력 보존 확인 후 AI 시작</title><desc id="desc">접수, Delta Bronze commit, 확인 이벤트를 별도 단계로 구분합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">입력 보존 확인 후 AI 시작</text><text class="sub" x="53" y="102">접수, Delta Bronze commit, 확인 이벤트를 별도 단계로 구분합니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  입력 접수와 Bronze 기록</text><rect x="55" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="73" y="215">1  파일 저장</text><text class="card-body" x="73" y="241">불변 키 · checksum 확인</text><path d="M329 222H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="426" y="215">2  MySQL 접수</text><text class="card-body" x="426" y="241">입력 버전 · 보존 작업</text><path d="M682 222H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="779" y="215">3  Kafka 전달</text><text class="card-body" x="779" y="241">user.input.received</text><path d="M1035 222H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1132" y="215">4  Spark·Delta</text><text class="card-body" x="1132" y="241">Bronze MERGE · commit</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  완료 확인과 해석 등록</text><rect x="55" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="73" y="381">5  완료 이벤트</text><text class="card-body" x="73" y="407">bronze.persisted 발행</text><path d="M329 388H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="426" y="381">6  Application 수신</text><text class="card-body" x="426" y="407">입력 버전 · checksum 대조</text><path d="M682 388H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="779" y="381">7  해석 job 등록</text><text class="card-body" x="779" y="407">같은 버전 중복 방지</text><path d="M1035 388H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="1132" y="381">8  AI 처리 대기</text><text class="card-body" x="1132" y="407">입력 보존 확인 후 시작</text><text class="note" x="53" y="498">AI 해석 job은 보존 확인과 입력 checksum 대조가 끝난 뒤 한 번만 등록합니다. 전체 경로는 단일 트랜잭션이 아닙니다.</text></svg>
