<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">입력 해석과 템플릿 선택</title><desc id="desc">입력 해석 후 네 상태 중 하나를 결정하고 사용자에게 다음 동작을 제시합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">입력 해석과 템플릿 선택</text><text class="sub" x="53" y="102">입력 해석 후 네 상태 중 하나를 결정하고 사용자에게 다음 동작을 제시합니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  선택 판단</text><rect x="80" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="98" y="215">사진·스케치·텍스트</text><text class="card-body" x="98" y="241">보존된 입력 버전</text><path d="M420 222H541" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="555" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="573" y="215">품목·특징 해석</text><text class="card-body" x="573" y="241">근거 없는 속성은 미확정</text><path d="M895 222H1016" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1030" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1048" y="215">템플릿 후보 확인</text><text class="card-body" x="1048" y="241">같은 품목 · 검수 버전</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  판단 결과 · 네 갈래</text><rect x="55" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="73" y="381">SELECTED</text><text class="card-body" x="73" y="407">템플릿 확정 → 생성</text><rect x="408" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="426" y="381">품목 선택 필요</text><text class="card-body" x="426" y="407">후보 선택 또는 입력 수정</text><rect x="761" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="779" y="381">템플릿 선택 필요</text><text class="card-body" x="779" y="407">같은 품목 안에서 선택</text><rect x="1114" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="1132" y="381">템플릿 없음</text><text class="card-body" x="1132" y="407">조건·품목 변경 안내</text><text class="note" x="53" y="498">선택 대기와 템플릿 부재 상태에서는 이미지 생성 API를 호출하지 않습니다.</text></svg>
