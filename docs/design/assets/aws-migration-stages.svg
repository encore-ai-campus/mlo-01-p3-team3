<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">로컬에서 AWS로 이전</title><desc id="desc">현재 운영을 멈추고 데이터·인덱스를 옮긴 뒤 검증 범위부터 다시 엽니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">로컬에서 AWS로 이전</text><text class="sub" x="53" y="102">현재 운영을 멈추고 데이터·인덱스를 옮긴 뒤 검증 범위부터 다시 엽니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  중단과 이전</text><rect x="55" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="73" y="215">1  현황 기록</text><text class="card-body" x="73" y="241">용량 · 버전 · 복원 방식</text><path d="M329 222H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="426" y="215">2  AWS 준비</text><text class="card-body" x="426" y="241">네트워크 · 저장소 · 비밀값</text><path d="M682 222H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="779" y="215">3  쓰기 중단</text><text class="card-body" x="779" y="241">사용자 · 수집 · AI 요청</text><path d="M1035 222H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1132" y="215">4  데이터 이전</text><text class="card-body" x="1132" y="241">DB · 이미지 · Delta · 로그</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  대조와 재개</text><rect x="55" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="73" y="381">5  Kafka 처리</text><text class="card-body" x="73" y="407">이전 또는 원천에서 재발행</text><path d="M329 388H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="426" y="381">6  무결성 대조</text><text class="card-body" x="426" y="407">건수 · checksum · UUID</text><path d="M682 388H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="779" y="381">7  인덱스 검증</text><text class="card-body" x="779" y="407">FAISS · 매핑 · 모델 버전</text><path d="M1035 388H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="1132" y="381">8  단계별 재개</text><text class="card-body" x="1132" y="407">BRD 시나리오 후 작은 범위</text><text class="note" x="53" y="498">검증 실패 시 이전 환경으로 돌아갈 기간을 먼저 정합니다. 서로 다른 시점의 VM 스냅샷만으로 전체 일관성을 보장하지 않습니다.</text></svg>
