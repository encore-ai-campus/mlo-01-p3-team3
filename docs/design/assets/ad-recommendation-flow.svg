<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">물체별 추천 요청</title><desc id="desc">웹 요청은 작업 ID를 먼저 반환하고 추천 검색은 Consumer가 비동기로 처리합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">물체별 추천 요청</text><text class="sub" x="53" y="102">웹 요청은 작업 ID를 먼저 반환하고 추천 검색은 Consumer가 비동기로 처리합니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  웹 요청</text><rect x="80" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="98" y="215">1  물체 선택</text><text class="card-body" x="98" y="241">웹이 Application에 요청</text><path d="M420 222H541" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="555" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="573" y="215">2  권한 확인</text><text class="card-body" x="573" y="241">run · job 등록</text><path d="M895 222H1016" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1030" y="186" width="330" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1048" y="215">3  처리 중 응답</text><text class="card-body" x="1048" y="241">웹에 작업 ID 반환</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  비동기 검색과 결과</text><rect x="55" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="73" y="381">4  Consumer</text><text class="card-body" x="73" y="407">광고 서버 내부 API 호출</text><path d="M329 388H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="426" y="381">5  광고 서버</text><text class="card-body" x="426" y="407">임베딩 · 검색 · 후보 검증</text><path d="M682 388H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="779" y="381">6  결과 저장</text><text class="card-body" x="779" y="407">MySQL 추천 이력 확정</text><path d="M1035 388H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="352" width="264" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="1132" y="381">7  웹 조회</text><text class="card-body" x="1132" y="407">작업 상태 · 결과 표시</text><text class="note" x="53" y="498">추천 결과 반환만으로 실제 노출을 집계하지 않습니다. 생성 결과는 추천 실패 시에도 유지합니다.</text></svg>
