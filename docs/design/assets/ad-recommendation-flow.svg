<text x="1091.3333333333335" y="668" font-size="17" font-weight="400" text-anchor="start" data-max-width="430.6666666666667" style="fill:#52697d">클릭 때 Ad 링크 재검증</text>
<text x="56" y="764" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">상품 임베딩·인덱스·운영 모델은 사전 준비합니다. 매 요청 전체 상품 재벡터화·학습을 하지 않습니다.</text>
<text x="56" y="796" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">모델 미준비·추론 실패와 후보 없음을 구분합니다. 완료된 해석과 벡터는 실패 복구 시 재사용합니다.</text>
<text x="56" y="848" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">생성 이미지·물체 선택·생성 크롭은 요구하지 않습니다. 흐름은 설계이며 API·스키마 구현 완료를 뜻하지 않습니다.</text>
