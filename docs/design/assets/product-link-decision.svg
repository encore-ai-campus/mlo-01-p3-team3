<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">상품 페이지 연결 결정</title><desc id="desc">원천 상품 ID와 다나와 연결 주소를 분리하고 검증된 링크만 노출합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">상품 페이지 연결 결정</text><text class="sub" x="53" y="102">원천 상품 ID와 다나와 연결 주소를 분리하고 검증된 링크만 노출합니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  기본 연결 · 다나와</text><rect x="55" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="73" y="215">추천 상품</text><text class="card-body" x="73" y="241">원천 ID · 내부 상품 유지</text><path d="M329 222H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="426" y="215">대응 주소 확인</text><text class="card-body" x="426" y="241">상품명 · 모델 · 규격 대조</text><path d="M682 222H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="779" y="215">링크 상태 검증</text><text class="card-body" x="779" y="241">HTTPS · 허용 호스트</text><path d="M1035 222H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1132" y="215">결과</text><text class="card-body" x="1132" y="241">보기 버튼 또는 연결 대기</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  선택 연결 · 판매처</text><rect x="80" y="352" width="330" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="98" y="381">Offer 존재</text><text class="card-body" x="98" y="407">판매처 · 옵션 확인</text><path d="M420 388H541" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="555" y="352" width="330" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="573" y="381">구매 URL 검증</text><text class="card-body" x="573" y="407">현재 상태 · 조건 확인</text><path d="M895 388H1016" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1030" y="352" width="330" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="1048" y="381">결과</text><text class="card-body" x="1048" y="407">확인된 경우만 구매 버튼</text><text class="note" x="53" y="498">원천 가격을 다른 연결 상품의 가격으로 바꾸지 않습니다. 직접 판매 링크는 기본 비교 연결의 필수 조건이 아닙니다.</text></svg>
