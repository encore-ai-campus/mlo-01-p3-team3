<text x="56" y="956" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">검색 벡터는 파일 단위입니다. 현재 product_images 연결을 검증해 상품으로 확장하며 상품 UUID별 중복을 정리합니다.</text>
<text x="56" y="987" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">run에는 ranking_model_ref_json·feature_schema_version·ranking_version을, item에는 model_score를 기록합니다.</text>
<text x="56" y="1018" font-size="16" font-weight="400" text-anchor="start" data-max-width="1490" style="fill:#5e7080">관계 일부를 생략한 v2 논리 그림입니다. 생성물 참조는 신규 필수가 아니며 상세 FK·제약은 속성 사전을 따릅니다.</text>
