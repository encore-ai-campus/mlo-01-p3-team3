<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="516" viewBox="0 0 1440 516" role="img" aria-labelledby="title desc">
<title id="title">추천 상품 링크 클릭</title><desc id="desc">사용자는 주소 대신 추천 항목 ID를 보내고, 이동 전에 링크를 검증합니다.</desc>
<defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#17324b}.title{font-size:37px;font-weight:700}.sub{font-size:18px;fill:#596e80}.lane-title{font-size:21px;font-weight:700}.card-title{font-size:20px;font-weight:700}.card-body{font-size:16px;fill:#52697d}.note{font-size:16px;fill:#576e80}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#657d93" stroke-width="2"/></marker></defs>
<rect width="1440" height="516" fill="#f6f9fc"/><rect width="1440" height="9" fill="#218f83"/>
<text class="title" x="52" y="66">추천 상품 링크 클릭</text><text class="sub" x="53" y="102">사용자는 주소 대신 추천 항목 ID를 보내고, 이동 전에 링크를 검증합니다.</text><rect x="38" y="126" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="143" width="7" height="28" rx="3" fill="#176b63"/><text class="lane-title" x="76" y="165" fill="#176b63">A  링크 결정</text><rect x="55" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="73" y="215">1  웹 클릭</text><text class="card-body" x="73" y="241">항목 ID · 링크 종류</text><path d="M329 222H394" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="408" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="426" y="215">2  Application</text><text class="card-body" x="426" y="241">소유자 · 항목 권한 확인</text><path d="M682 222H747" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="761" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="779" y="215">3  광고 서버</text><text class="card-body" x="779" y="241">상품 대응 · 현재 URL 확인</text><path d="M1035 222H1100" stroke="#657d93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1114" y="186" width="264" height="72" rx="13" fill="#eaf5f3" stroke="#6cb4a8" stroke-width="1.5"/>
<text class="card-title" x="1132" y="215">4  검증 결과</text><text class="card-body" x="1132" y="241">URL 또는 실패 사유 반환</text><rect x="38" y="292" width="1364" height="151" rx="20" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
<rect x="55" y="309" width="7" height="28" rx="3" fill="#285d9b"/><text class="lane-title" x="76" y="331" fill="#285d9b">B  응답 결과 · 둘 중 하나</text><rect x="250" y="352" width="375" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="268" y="381">성공</text><text class="card-body" x="268" y="407">클릭 기록 후 이동 응답</text><rect x="815" y="352" width="375" height="72" rx="13" fill="#edf3fd" stroke="#8bb2e3" stroke-width="1.5"/>
<text class="card-title" x="833" y="381">실패</text><text class="card-body" x="833" y="407">이동 없이 원인 안내</text><text class="note" x="53" y="498">검증 실패에는 이동하지 않고 실패 사유를 안내합니다. 클릭 성공은 구매 완료나 외부 페이지 로드를 뜻하지 않습니다.</text></svg>
