<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SketchOn · 광고 운영{% endblock %}</title><style>
:root{color-scheme:light;--ink:#17352d;--muted:#66746f;--line:#dfe7e2;--green:#21634f;--bg:#f5f7f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}a{color:var(--green)}header{background:white;border-bottom:1px solid var(--line);padding:18px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:21px;letter-spacing:-.6px}nav{display:flex;gap:20px;font-size:13px}main{max-width:1200px;margin:38px auto;padding:0 24px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:19px;margin:0 0 16px}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:1px}.muted{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;margin-top:28px}.tag{display:inline-block;font-size:12px;border-radius:6px;padding:3px 9px;background:#eaf2ed;color:var(--green)}button,select,input{font:inherit}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;cursor:pointer;padding:10px 15px}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #66ac90;outline-offset:3px}button.primary{background:var(--green);color:white}.banner{max-width:300px;margin:auto}.banner img{display:block;width:100%;height:auto;aspect-ratio:1/2;object-fit:contain;border-radius:8px;background:#f3f4f0}.ad-label{font-size:11px;color:var(--muted);margin-bottom:6px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;display:flex;justify-content:space-between;align-items:center}.tile[aria-pressed=true]{background:#eaf2ed;border-color:var(--green)}.tile span{word-break:keep-all}.tile small{flex-shrink:0;font-size:11px;color:var(--muted)}.checks{padding:16px 0;border-top:1px solid var(--line);margin-top:20px}.status{min-height:25px;color:var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#f2f5f2;padding:16px;border-radius:9px;font-size:12px;max-height:340px;overflow:auto}label{display:block;margin:12px 0 6px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.hidden{display:none!important}footer{margin:32px 0;color:var(--muted);font-size:12px}@media(max-width:760px){header{padding:16px 20px;align-items:flex-start}nav{gap:9px;flex-wrap:wrap;max-width:190px;justify-content:flex-end}main{margin:24px auto;padding:0 16px}.layout{grid-template-columns:1fr}.panel{padding:20px}h1{font-size:27px}.tiles{grid-template-columns:1fr 1fr}.layout>.panel:last-child{max-width:100%}}
</style>{% block head %}{% endblock %}</head><body><header><strong>SketchOn <span class="muted">/ 광고 운영</span></strong><nav><a href="/">배너 확인</a><a href="/sandbox/">모의 운영</a><a href="/admin/">관리자</a></nav></header><main>{% block content %}{% endblock %}<footer>독립 광고 테스트 서버 · 기존 추천 영역과 분리 · 실제 결제·CPC 차감 없음</footer></main>{% block script %}{% endblock %}</body></html>
