[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "danawa-data-pipeline"
version = "0.1.0"
description = "Immutable FULL_EXPORT ingestion, image storage and recoverable source publishing"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=10,<13", "pymongo>=4.18,<5", "boto3>=1.40,<2", "confluent-kafka>=2.12,<3"]

[project.scripts]
danawa-pipeline = "product_pipeline.cli:main"
danawa-bronze = "product_pipeline.bronze.cli:main"

[project.optional-dependencies]
bronze = ["pyspark==4.0.1", "delta-spark==4.0.1"]

[tool.setuptools.packages.find]
include = ["product_pipeline*"]
