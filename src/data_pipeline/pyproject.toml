[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "danawa-data-pipeline"
version = "0.1.0"
description = "Immutable Danawa ingestion, LIVE handoff, Bronze, Silver and Gold evaluations"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=10,<13", "pymongo>=4.18,<5", "boto3>=1.40,<2", "confluent-kafka>=2.12,<3"]

[project.scripts]
danawa-pipeline = "product_pipeline.cli:main"
danawa-bronze = "product_pipeline.bronze.cli:main"
danawa-silver = "product_pipeline.silver.cli:main"
danawa-gold = "product_pipeline.gold.cli:main"
danawa-publication = "product_pipeline.publication.cli:main"
danawa-run-registration = "product_pipeline.registration:main"
danawa-review = "product_pipeline.review_cli:main"
danawa-operations = "product_pipeline.operations.cli:main"

[project.optional-dependencies]
bronze = ["pyspark==4.0.1", "delta-spark==4.0.1"]
silver = ["pyspark==4.0.1", "delta-spark==4.0.1"]
gold = ["pyspark==4.0.1", "delta-spark==4.0.1"]
publication = ["PyMySQL==1.1.2"]

[tool.setuptools.packages.find]
include = ["product_pipeline*"]
