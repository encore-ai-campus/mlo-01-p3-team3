{% extends 'sketch/my_base.html' %}{% block content %}<p class="eyebrow">YOUR PROJECT</p><h1>{{ saved_project.title }}</h1><p>저장한 이미지는 유지돼요. 수정한 결과는 새로운 버전으로 저장됩니다.</p><div class="saved-project-grid">{% for version in versions %}<article class="saved-project-card"><img src="/api/saved-versions/{{ version.id }}/image/" alt="버전 {{ version.version_number }} 공간"><h2>버전 {{ version.version_number }}</h2><p>{{ version.created_at|date:'Y.m.d H:i' }}</p><button data-edit-version="{{ version.id }}">이 버전의 스케치 수정하기 ↗</button></article>{% endfor %}</div><p><a href="/my/projects/">← 모든 프로젝트 · 이미지 비교</a></p><p id="library-status" role="status"></p>{% endblock %}
